services:
  - type: web
    name: autonomepay-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./autonomepay.db
      - key: PRIMARY_MODEL
        value: openrouter/minimax/minimax-m3:free
      - key: SECONDARY_MODEL
        value: openrouter/minimax/minimax-m2.7:free
      - key: THIRD_MODEL
        value: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - key: FALLBACK_MODEL
        value: openrouter/openrouter/free
