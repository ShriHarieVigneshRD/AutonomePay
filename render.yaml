services:
  - type: web
    name: autonomepay-backend
    env: python
    buildCommand: "pip install uv && uv pip install -r backend/requirements.txt --system"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./autonomepay.db
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: openrouter/minimax/minimax-m3:free
      - key: SECONDARY_MODEL
        value: openrouter/minimax/minimax-m2.7:free
      - key: THIRD_MODEL
        value: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      - key: FALLBACK_MODEL
        value: openrouter/openrouter/free
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mock12345
      - key: RAZORPAY_KEY_SECRET
        value: mock_secret_67890
